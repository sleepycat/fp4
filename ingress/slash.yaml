apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    caddy.ingress.kubernetes.io/disable-ssl-redirect: "true"
  name: uirule
  namespace: ui
spec:
  rules:
  - http:
      paths:
      - backend:
          service:
            name: ui
            port:
              number: 3000
        path: /
        pathType: Exact
status:
  loadBalancer: {}
